name: sondeo
on:
  workflow_dispatch:
  push:
    paths: [".github/workflows/sondeo.yml", "scripts/sondeo.py"]
permissions: {contents: write}
jobs:
  s:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: mkdir -p out && python scripts/sondeo.py out || true
      - run: |
          cd out && git init -q && git checkout -q -b sondeo && git add . && git -c user.name=bot -c user.email=bot@x commit -qm s && git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" sondeo
